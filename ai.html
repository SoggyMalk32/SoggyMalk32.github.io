<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local WebGPU AI</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 650px;
      margin: 40px auto;
      padding: 0 20px;
      background: #0f172a;
      color: #f8fafc;
    }
    #chat-box {
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px;
      height: 350px;
      overflow-y: auto;
      background: #1e293b;
      margin-bottom: 12px;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .input-group {
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
    }
    button {
      padding: 10px 18px;
      border-radius: 6px;
      border: none;
      background: #2563eb;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled {
      background: #475569;
      cursor: not-allowed;
    }
    #status {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <h2>Browser-Local AI Engine</h2>
  <div id="chat-box">System initialized. Click 'Initialize Model' to begin...</div>
  
  <div class="input-group">
    <input type="text" id="prompt-input" placeholder="Type a message..." disabled>
    <button id="action-btn">Initialize Model</button>
  </div>
  
  <div id="status">Status: Idle</div>

  <!-- Import WebLLM directly via CDN -->
  <script type="module">
    import * as webllm from "https://esm.run/@mlc-ai/web-llm";

    // Lightweight 1B parameter model optimized for web execution
    const SELECTED_MODEL = "Llama-3.2-1B-Instruct-q4f16_1-MLC";
    
    let engine;
    const chatBox = document.getElementById("chat-box");
    const promptInput = document.getElementById("prompt-input");
    const actionBtn = document.getElementById("action-btn");
    const statusDiv = document.getElementById("status");

    let isInitialized = false;

    // 1. Initialize and Load Model Weights into Browser Cache
    async function initModel() {
      actionBtn.disabled = true;
      actionBtn.innerText = "Loading...";
      
      try {
        engine = await webllm.CreateMLCEngine(
          SELECTED_MODEL,
          {
            initProgressCallback: (report) => {
              statusDiv.innerText = `Status: ${report.text}`;
            }
          }
        );
        
        isInitialized = true;
        chatBox.innerHTML += `<br><br><b>System:</b> Model loaded successfully! Write your prompt below.`;
        statusDiv.innerText = "Status: Ready (Model cached locally)";
        promptInput.disabled = false;
        actionBtn.innerText = "Send";
        actionBtn.disabled = false;
      } catch (err) {
        statusDiv.innerText = `Error: ${err.message}. Make sure your browser supports WebGPU.`;
        actionBtn.disabled = false;
        actionBtn.innerText = "Retry";
      }
    }

    // 2. Stream Generation Responses
    async function sendMessage() {
      const text = promptInput.value.trim();
      if (!text) return;

      promptInput.value = "";
      actionBtn.disabled = true;
      chatBox.innerHTML += `<br><br><b>You:</b> ${text}`;
      
      // Append placeholder for assistant response
      const assistantMessageId = `bot-${Date.now()}`;
      chatBox.innerHTML += `<br><b>AI:</b> <span id="${assistantMessageId}">...</span>`;
      const botResponseElem = document.getElementById(assistantMessageId);

      try {
        const completion = await engine.chat.completions.create({
          messages: [{ role: "user", content: text }],
          stream: true,
        });

        let fullText = "";
        for await (const chunk of completion) {
          const delta = chunk.choices[0]?.delta?.content || "";
          fullText += delta;
          botResponseElem.innerText = fullText;
          chatBox.scrollTop = chatBox.scrollHeight;
        }
      } catch (err) {
        botResponseElem.innerText = `Error generating response: ${err.message}`;
      }

      actionBtn.disabled = false;
    }

    // Button click router
    actionBtn.addEventListener("click", () => {
      if (!isInitialized) {
        initModel();
      } else {
        sendMessage();
      }
    });

    promptInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter" && isInitialized && !actionBtn.disabled) {
        sendMessage();
      }
    });
  </script>
</body>
</html>
