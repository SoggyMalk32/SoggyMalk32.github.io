<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI Assistant</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 650px;
      margin: 40px auto;
      padding: 0 20px;
      background: #0f172a;
      color: #f8fafc;
    }
    #chat-box {
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px;
      height: 380px;
      overflow-y: auto;
      background: #1e293b;
      margin-bottom: 12px;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .input-group {
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      padding: 12px 14px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
    }
    button {
      padding: 12px 20px;
      border-radius: 6px;
      border: none;
      background: #2563eb;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled {
      background: #475569;
      cursor: not-allowed;
    }
    .note {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <h2>Live Local AI Chat</h2>
  <div id="chat-box">Type a prompt below to talk to the AI...</div>
  
  <div class="input-group">
    <input type="text" id="prompt-input" placeholder="Ask something..." />
    <button id="send-btn">Send</button>
  </div>
  <div class="note">Powered live by my PC</div>

  <script>
    // ================================================================
    // PASTE YOUR LOCALTUNNEL URL HERE (No trailing slash)
    // ================================================================
    const TUNNEL_URL = "https://your-localtunnel-url.loca.lt";
    
    // Choose which model installed on your PC to use
    const MODEL_NAME = "llama3.2:1b"; 
    // ================================================================

    const chatBox = document.getElementById("chat-box");
    const promptInput = document.getElementById("prompt-input");
    const sendBtn = document.getElementById("send-btn");

    async function sendMessage() {
      const text = promptInput.value.trim();
      if (!text) return;

      promptInput.value = "";
      sendBtn.disabled = true;
      chatBox.innerHTML += `<br><br><b>Visitor:</b> ${text}`;

      const botId = `bot-${Date.now()}`;
      chatBox.innerHTML += `<br><b>AI:</b> <span id="${botId}">...</span>`;
      const botElem = document.getElementById(botId);

      try {
        const response = await fetch(`${TUNNEL_URL}/api/generate`, {
          method: "POST",
          headers: { 
            "Content-Type": "application/json",
            "Bypass-Tunnel-Remainder": "true" // Automatically bypasses Localtunnel's landing page
          },
          body: JSON.stringify({
            model: MODEL_NAME,
            prompt: text,
            stream: true
          })
        });

        if (!response.ok) throw new Error("Could not connect to host PC.");

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        botElem.innerText = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split("\n");

          for (const line of lines) {
            if (line.trim() !== "") {
              try {
                const parsed = JSON.parse(line);
                botElem.innerText += parsed.response;
                chatBox.scrollTop = chatBox.scrollHeight;
              } catch (e) {
                // Ignore incomplete JSON chunks
              }
            }
          }
        }
      } catch (err) {
        botElem.innerText = `Error: ${err.message}. Make sure the host PC terminal is running!`;
      }

      sendBtn.disabled = false;
    }

    sendBtn.addEventListener("click", sendMessage);
    promptInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter" && !sendBtn.disabled) sendMessage();
    });
  </script>
</body>
</html>
