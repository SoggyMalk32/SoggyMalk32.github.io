<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mod Ban Panel</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121214; color: #e1e1e6; max-width: 600px; margin: 40px auto; padding: 20px; }
        h1 { color: #ff5555; text-align: center; }
        .card { background: #202024; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); margin-bottom: 20px; }
        input, button { width: 100%; padding: 12px; margin-top: 8px; border-radius: 6px; border: none; box-sizing: border-box; font-size: 16px; }
        input { background: #121214; color: white; border: 1px solid #323238; }
        button { background: #ff5555; color: white; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #e04444; }
        ul { list-style: none; padding: 0; }
        li { background: #121214; padding: 12px; margin-bottom: 8px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #323238; }
        .unban-btn { width: auto; background: #323238; color: #ff5555; padding: 6px 12px; margin: 0; font-size: 14px; }
        .unban-btn:hover { background: #ff5555; color: white; }
    </style>
</head>
<body>

    <h1>🚨 Mod Ban Panel</h1>
    
    <div class="card">
        <h3>Ban a Player</h3>
        <input type="text" id="playerId" placeholder="Paste Player ID (Meta/Steam ID)">
        <button onclick="addBan()">Ban Player</button>
    </div>

    <div class="card">
        <h3>Currently Banned Players</h3>
        <ul id="banList">Loading list...</ul>
    </div>

    <script>
        // Paste your RAW JSONbin info here! (No encryption needed since the file is hidden)
        const BIN_ID = "YOUR_BIN_ID_HERE"; 
        const API_KEY = "Y$2a$10$6mvlQEr/DDSAgJ6RVgb.NugD0/1U2CXQAYCBFydyvU1EchDcA3wFq"; 

        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
        let bannedList = [];

        async function loadBans() {
            try {
                const response = await fetch(API_URL, {
                    headers: { "X-Master-Key": API_KEY }
                });
                const data = await response.json();
                bannedList = data.record.banned_ids || [];
                renderList();
            } catch (err) {
                document.getElementById('banList').innerHTML = "<span style='color: red;'>Error loading database. Check config.</span>";
            }
        }

        function renderList() {
            const listEl = document.getElementById('banList');
            if (bannedList.length === 0) {
                listEl.innerHTML = "<li>No banned players!</li>";
                return;
            }
            listEl.innerHTML = bannedList.map(id => `
                <li>
                    <span>${id}</span>
                    <button class="unban-btn" onclick="removeBan('${id}')">Unban</button>
                </li>
            `).join('');
        }

        async function saveBans(newList) {
            try {
                await fetch(API_URL, {
                    method: 'PUT',
                    headers: {
                        "Content-Type": "application/json",
                        "X-Master-Key": API_KEY
                    },
                    body: JSON.stringify({ banned_ids: newList })
                });
                bannedList = newList;
                renderList();
            } catch (err) {
                alert("Failed to update database.");
            }
        }

        async function addBan() {
            const input = document.getElementById('playerId');
            const id = input.value.trim();
            if (!id) return;
            if (bannedList.includes(id)) {
                alert("Player is already banned!");
                return;
            }
            const updated = [...bannedList, id];
            await saveBans(updated);
            input.value = '';
        }

        async function removeBan(id) {
            if (confirm(`Are you sure you want to unban ${id}?`)) {
                const updated = bannedList.filter(item => item !== id);
                await saveBans(updated);
            }
        }

        loadBans();
    </script>
</body>
</html>
