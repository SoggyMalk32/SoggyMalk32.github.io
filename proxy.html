<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Web Wrapper</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #1a1a1a;
            color: #ffffff;
        }
        #nav-bar {
            display: flex;
            padding: 10px;
            background-color: #2d2d2d;
            gap: 10px;
        }
        #url-input {
            flex-grow: 1;
            padding: 8px 12px;
            border: 1px solid #444;
            border-radius: 4px;
            background-color: #333;
            color: #fff;
            outline: none;
        }
        button {
            padding: 8px 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #viewer {
            flex-grow: 1;
            border: none;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <div id="nav-bar">
        <input type="text" id="url-input" placeholder="Enter URL (e.g., example.com)">
        <button onclick="loadSite()">Go</button>
    </div>

    <iframe id="viewer" src="about:blank"></iframe>

    <script>
        function loadSite() {
            let input = document.getElementById('url-input').value.trim();
            
            if (!input) return;

            // Automatically prepend https:// if missing
            if (!input.startsWith('http://') && !input.startsWith('https://')) {
                input = 'https://' + input;
            }

            // Construct the Google Translate proxy URL
            const proxyUrl = 'https://translate.google.com/translate?sl=auto&tl=en&u=' + encodeURIComponent(input);

            // Set the iframe source
            document.getElementById('viewer').src = proxyUrl;
        }

        // Allow pressing "Enter" in the input field
        document.getElementById('url-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                loadSite();
            }
        });
    </script>

</body>
</html>
